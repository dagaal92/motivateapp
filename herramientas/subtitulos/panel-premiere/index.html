<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Subtítulos palabra por palabra</title>
<style>
  body { background: #232323; color: #ddd; font: 12px system-ui, sans-serif; margin: 0; padding: 12px; }
  label { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; gap: 8px; }
  select { background: #1b1b1b; color: #ddd; border: 1px solid #444; padding: 3px; width: 55%; }
  button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 4px; cursor: pointer; }
  #generar { background: #2d8ceb; color: #fff; font-weight: 600; font-size: 13px; }
  #generar:disabled { background: #555; cursor: default; }
  #preset { background: #3a3a3a; color: #bbb; font-size: 11px; }
  #log { margin-top: 10px; background: #1b1b1b; border: 1px solid #333; height: 180px; overflow-y: auto;
         padding: 6px; white-space: pre-wrap; font: 11px monospace; color: #aaa; }
  .ok { color: #6c6; } .error { color: #f66; }
</style>
</head>
<body>
  <label>Palabras por subtítulo
    <select id="palabras"><option>1</option><option>2</option><option>3</option></select>
  </label>
  <label>Idioma
    <select id="idioma"><option value="es">Español</option><option value="en">Inglés</option></select>
  </label>
  <label>Precisión
    <select id="modelo">
      <option value="base">Rápida</option>
      <option value="small" selected>Normal</option>
      <option value="medium">Alta (lenta)</option>
      <option value="large-v3">Máxima (muy lenta)</option>
    </select>
  </label>
  <label>Posición del texto
    <select id="posicion">
      <option value="30">Arriba</option>
      <option value="50">Centro</option>
      <option value="70" selected>Abajo</option>
    </select>
  </label>
  <label>MAYÚSCULAS <input type="checkbox" id="mayusculas" checked></label>
  <label>Quitar puntuación <input type="checkbox" id="sinPuntuacion"></label>

  <button id="generar">Subtitular secuencia activa</button>
  <button id="preset">Elegir preset de audio (solo si falla la exportación)</button>
  <div id="log"></div>

  <script src="main.js"></script>
</body>
</html>
